[package]
name = "solana-flashloan-arbitrage"
version = "0.1.0"
edition = "2021"
description = "Recovered Anchor program (Aug 2025): risk-parameter state and simulated strategy bookkeeping; no lending or swap CPIs"

[lib]
crate-type = ["cdylib", "lib"]
name = "solana_flashloan_arbitrage"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.30.1"

[dev-dependencies]
solana-program-test = "1.18.26"
solana-sdk = "1.18.26"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
