name: Project checks
concurrency:
  group: project-checks-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: python scripts/check_projects.py
  banking:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: pesa_test_integration
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:ci-test-only@localhost:5432/pesa_test_integration
      TEST_DATABASE_URL: postgresql://postgres:ci-test-only@localhost:5432/pesa_test_integration
      APP_MODE: database
    defaults:
      run:
        working-directory: portfolio-projects/pesa-fams-banking-prototype
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm test
  trace-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trace-stores/services/trace-api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.txt
      - run: python ../../scripts/download_model.py
      - run: python -m pytest tests
        env:
          TEST_PRETRAINED_MODEL: ${{ github.workspace }}/trace-stores/models/u2netp.onnx
  storefront:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trace-stores/apps/storefront
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm test
      - run: npm run build
  react-frontends:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [interview-nailer, blockchain-api-service, kubernetes-demo]
    defaults:
      run:
        working-directory: portfolio-projects/${{ matrix.project }}/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
      - run: npm test --if-present
      - run: npm run build
        env:
          CI: 'true'
  backend-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [blockchain-api-service, kubernetes-demo]
    defaults:
      run:
        working-directory: portfolio-projects/${{ matrix.project }}/backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
      - run: npm test
  interview-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: interview_test_integration
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: portfolio-projects/interview-nailer/backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run db:init && npm test
        env:
          TEST_STORAGE_MODE: postgres
          STORAGE_MODE: postgres
          DATABASE_URL: postgresql://postgres:ci-test-only@localhost:5432/interview_test_integration
          DATABASE_SSL: 'false'
          AI_MODE: mock
  voice-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s portfolio-projects/voice-ai-missed-call/demo -p 'test_*.py' -v
  terraform-validation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory: [terraform-modules/vpc, terraform-modules/alb, kubernetes-demo/terraform, blockchain-api-service/terraform]
    defaults:
      run:
        working-directory: portfolio-projects/${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.9.8'
      - run: terraform fmt -check
      - run: terraform init -backend=false -input=false
      - run: terraform validate -no-color
      - name: Exercise module plans with mock providers
        if: startsWith(matrix.directory, 'terraform-modules/')
        run: terraform test -no-color

  browser-journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run demo:setup
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser:managed
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-evidence
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 14

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: blockchain-api-service
            port: 8081
            api: /api/v1/chains
          - project: kubernetes-demo
            port: 8082
            api: /api/data
    defaults:
      run:
        working-directory: portfolio-projects/${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 180
      - name: Verify frontend and proxied API
        run: |
          curl --fail --retry 5 --retry-delay 2 http://127.0.0.1:${{ matrix.port }}/
          curl --fail --retry 5 --retry-delay 2 http://127.0.0.1:${{ matrix.port }}${{ matrix.api }}
      - name: Container logs
        if: always()
        run: docker compose logs --no-color
      - name: Remove disposable CI containers
        if: always()
        run: docker compose down --volumes

  dependency-security:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory:
          - .
          - trace-stores/apps/storefront
          - portfolio-projects/interview-nailer/backend
          - portfolio-projects/interview-nailer/frontend
          - portfolio-projects/blockchain-api-service/backend
          - portfolio-projects/blockchain-api-service/frontend
          - portfolio-projects/kubernetes-demo/backend
          - portfolio-projects/kubernetes-demo/frontend
          - portfolio-projects/pesa-fams-banking-prototype
          - onchain-execution-engine/tests
          - flashloan-contracts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm audit --package-lock-only --audit-level=high
        working-directory: ${{ matrix.directory }}

  python-dependency-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit --require-hashes --no-deps -r trace-stores/services/trace-api/requirements-test.txt

  execution-engine-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s onchain-execution-engine/tests -p 'test_*.py' -v
      - run: npm ci --ignore-scripts
        working-directory: onchain-execution-engine/tests
      - run: npm test
        working-directory: onchain-execution-engine/tests
      - run: npm run compile
        working-directory: onchain-execution-engine/tests

  flashloan-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: flashloan-contracts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.6
      - run: npm ci --ignore-scripts
      - run: forge build
      - run: forge test -vv

  solana-flashloan-program:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: solana-flashloan-program
    env:
      AGAVE_VERSION: v4.3.2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/solana
            ~/.local/share/solana
            solana-flashloan-program/target
          key: solana-${{ runner.os }}-agave-v4.3.2-${{ hashFiles('solana-flashloan-program/Cargo.lock') }}
          restore-keys: solana-${{ runner.os }}-agave-v4.3.2-
      - name: Install Agave (Solana) CLI
        run: |
          if [ ! -x "$HOME/.local/share/solana/install/active_release/bin/cargo-build-sbf" ]; then
            sh -c "$(curl -sSfL https://release.anza.xyz/${AGAVE_VERSION}/install)"
          fi
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      # --arch v0: the solana-program-test 1.18 runtime used by the tests cannot load the default SBPF v3 output.
      - run: cargo build-sbf --arch v0
      - run: cargo test-sbf --arch v0

  arbitrum-relay-node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: arbitrum-relay-node
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: docker compose config --quiet
      - run: shellcheck scripts/*.sh
      - run: python -m pip install -r requirements.txt pytest==9.1.1
      - run: python -m pytest tests -v
