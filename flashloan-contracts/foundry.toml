[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
libs = ["node_modules"]
solc_version = "0.8.20"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
# Tests run in Foundry's local EVM only. No fork URL and no private key are configured.
remappings = [
  "@aave/core-v3/=node_modules/@aave/core-v3/",
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "@uniswap/v3-core/=node_modules/@uniswap/v3-core/",
  "@uniswap/v3-periphery/=node_modules/@uniswap/v3-periphery/",
  "forge-std/=node_modules/forge-std/src/",
]
